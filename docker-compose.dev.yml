# ==============================================================================
# CodeSage AI — Development Override Compose Configuration
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:ro
      - chroma_data:/app/chroma_data
    environment:
      - LOG_LEVEL=DEBUG

  frontend:
    # In development mode, Vite's dev server can be mapped or run locally
    ports:
      - "5173:80"
